components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 500
        traceId:
          type: string
          maxLength: 64
        details:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
        - code
        - message
        - traceId
    User:
      type: object
      properties:
        id: *id001
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          maxLength: 100
      additionalProperties: false
      required:
        - id
        - email
        - displayName
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 100
      additionalProperties: false
      required:
        - email
        - password
        - displayName
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
      required:
        - email
        - password
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
