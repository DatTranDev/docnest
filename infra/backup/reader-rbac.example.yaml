# Independent operator/backup identity only. No DB Secret, Pod exec or mutation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: editor-online-backup-reader, namespace: editor-lab }
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames:
      [
        identity-service,
        document-service,
        processing-service,
        collaboration-service,
        payment-service,
        web,
      ]
    verbs: [get]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [editor-jwt]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: editor-online-backup-reader, namespace: editor-lab }
subjects:
  - kind: User
    name: editor-backup@YOUR_PROJECT.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef: { kind: Role, name: editor-online-backup-reader, apiGroup: rbac.authorization.k8s.io }
