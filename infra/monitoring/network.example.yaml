# Review the existing monitoring namespace/pod labels before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: private-metrics, namespace: editor-lab }
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          [
            identity-service,
            document-service,
            processing-service,
            collaboration-service,
            payment-service,
          ]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: prometheus } }
      ports: [{ port: 8080, protocol: TCP }]
