worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    client_max_body_size 32m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { return 200 'ok'; }
    location ^~ /internal { return 404; }
    location ^~ /actuator { return 404; }
    location ^~ /api/v1/auth { proxy_pass http://identity-service:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
    location ^~ /.well-known { proxy_pass http://identity-service:8080; }
    location ^~ /api/v1/jobs { proxy_pass http://processing-service:8080; proxy_set_header Host $http_host; proxy_read_timeout 130s; }
    location ^~ /api/ { proxy_pass http://document-service:8080; proxy_set_header Host $http_host; proxy_request_buffering off; proxy_read_timeout 130s; }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
  }
}
