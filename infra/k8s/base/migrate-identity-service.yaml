apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-identity-service
  labels:
    app: migrate-identity-service
    application: text-editor
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: identity-service
        application: text-editor
    spec:
      serviceAccountName: identity-service
      terminationGracePeriodSeconds: 45
      containers:
        - name: migrate
          image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT/editor/identity-service:REPLACE_WITH_DIGEST
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: jwt
              mountPath: /keys
              readOnly: true
          envFrom:
            - configMapRef:
                name: editor-config
          env:
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: IDENTITY_DB_PASSWORD
            - name: DOCUMENT_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: DOCUMENT_INTERNAL_KEY
            - name: PROCESSING_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: PROCESSING_INTERNAL_KEY
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: FLYWAY_ENABLED
              value: 'true'
          args:
            - --editor.migrate-only=true
            - --spring.flyway.enabled=true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: jwt
          secret:
            secretName: editor-jwt
      restartPolicy: Never
