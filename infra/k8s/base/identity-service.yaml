apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-service
  labels:
    app: identity-service
    application: text-editor
  annotations:
    iam.gke.io/gcp-service-account: editor-identity@YOUR_PROJECT.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app: identity-service
    application: text-editor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: identity-service
        application: text-editor
    spec:
      serviceAccountName: identity-service
      terminationGracePeriodSeconds: 45
      containers:
        - name: identity-service
          image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT/editor/identity-service:REPLACE_WITH_DIGEST
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: jwt
              mountPath: /keys
              readOnly: true
          envFrom:
            - configMapRef:
                name: editor-config
          env:
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: IDENTITY_DB_PASSWORD
            - name: DOCUMENT_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: DOCUMENT_INTERNAL_KEY
            - name: PROCESSING_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: PROCESSING_INTERNAL_KEY
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: KAFKA_USERNAME
              value: identity
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: KAFKA_IDENTITY_PASSWORD
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: jwt
          secret:
            secretName: editor-jwt
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  labels:
    app: identity-service
    application: text-editor
spec:
  selector:
    app: identity-service
  ports:
    - port: 8080
      targetPort: 8080
