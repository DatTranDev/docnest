apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app: mysql
    application: text-editor
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        application: text-editor
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: IDENTITY_DB_PASSWORD
            - name: DOCUMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: DOCUMENT_DB_PASSWORD
            - name: PROCESSING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: PROCESSING_DB_PASSWORD
            - name: COLLABORATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: COLLABORATION_DB_PASSWORD
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: PAYMENT_DB_PASSWORD
          args:
            - --innodb-buffer-pool-size=256M
            - --max-connections=100
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -uroot --silent
            periodSeconds: 10
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -uroot --silent
            failureThreshold: 60
            periodSeconds: 5
      terminationGracePeriodSeconds: 60
      securityContext: {}
      volumes:
        - name: init
          configMap:
            name: mysql-init
            defaultMode: 493
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
    application: text-editor
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
