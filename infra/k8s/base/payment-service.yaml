apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  labels:
    app: payment-service
    application: text-editor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
    application: text-editor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: payment-service
        application: text-editor
    spec:
      serviceAccountName: payment-service
      terminationGracePeriodSeconds: 45
      containers:
        - name: payment-service
          image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT/editor/payment-service:REPLACE_WITH_DIGEST
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: editor-config
          env:
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: PAYMENT_DB_PASSWORD
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: KAFKA_USERNAME
              value: payment
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: KAFKA_PAYMENT_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: STRIPE_WEBHOOK_SECRET
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app: payment-service
    application: text-editor
spec:
  selector:
    app: payment-service
  ports:
    - port: 8080
      targetPort: 8080
