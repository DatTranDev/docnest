apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app: kafka
    application: text-editor
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        application: text-editor
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_NODE_ID
              value: '1'
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: '1'
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: 'false'
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xmx768m -Xms256m
            - name: KAFKA_LISTENERS
              value: SASL_PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: SASL_PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: SASL_PLAINTEXT
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: PLAIN
            - name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL
              value: PLAIN
            - name: KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL
              value: PLAIN
            - name: KAFKA_AUTHORIZER_CLASS_NAME
              value: org.apache.kafka.metadata.authorizer.StandardAuthorizer
            - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
              value: 'false'
            - name: KAFKA_SUPER_USERS
              value: User:broker;User:admin
            - name: KAFKA_BROKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: KAFKA_BROKER_PASSWORD
            - name: KAFKA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: KAFKA_ADMIN_PASSWORD
            - name: KAFKA_DOCUMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: KAFKA_DOCUMENT_PASSWORD
            - name: KAFKA_PROCESSING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: KAFKA_PROCESSING_PASSWORD
            - name: KAFKA_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: KAFKA_OPERATOR_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: auth-config
              mountPath: /opt/editor-kafka
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          readinessProbe:
            exec: &id001
              command:
                - bash
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
                  --command-config /tmp/editor-kafka/admin.properties >/dev/null 2>&1
            periodSeconds: 10
            timeoutSeconds: 10
          startupProbe:
            exec: *id001
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          command:
            - bash
            - /opt/editor-kafka/kafka-start.sh
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      volumes:
        - name: auth-config
          configMap:
            name: kafka-auth
            defaultMode: 493
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
    application: text-editor
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
