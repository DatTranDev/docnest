apiVersion: v1
kind: ServiceAccount
metadata:
  name: collaboration-service
  labels:
    app: collaboration-service
    application: text-editor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collaboration-service
  labels:
    app: collaboration-service
    application: text-editor
spec:
  replicas: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: collaboration-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: collaboration-service
        application: text-editor
    spec:
      enableServiceLinks: false
      serviceAccountName: collaboration-service
      terminationGracePeriodSeconds: 160
      containers:
        - name: collaboration-service
          image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT/editor/collaboration-service:REPLACE_WITH_DIGEST
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 100
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: editor-config
          env:
            - name: COLLABORATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: COLLABORATION_DB_PASSWORD
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: KAFKA_USERNAME
              value: collaboration
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editor-secrets
                  key: KAFKA_COLLABORATION_PASSWORD
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 135s
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: collaboration-service
  labels:
    app: collaboration-service
    application: text-editor
spec:
  selector:
    app: collaboration-service
  ports:
    - port: 8080
      targetPort: 8080
