# Optional capacity/cost-reviewed overlay; not used by the deploy button.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../lab, pdb.yaml]
patches:
  - target: { kind: Deployment, name: '^(web|identity-service|document-service)$' }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
