name: Validate application
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      runtime_checks:
        type: boolean
        default: false
      full_acceptance:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: Run the full Docker/browser acceptance suite
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backends: ${{ steps.impact.outputs.backends }}
      web: ${{ steps.impact.outputs.web }}
      maven_projects: ${{ steps.impact.outputs.maven_projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - id: impact
        env:
          FULL: ${{ inputs.runtime_checks || inputs.full_acceptance }}
        run: |
          if [ "$FULL" = true ]; then
            python tooling/scripts/detect_affected.py --full
          else
            python tooling/scripts/detect_affected.py
          fi
  java-unit:
    needs: changes
    if: ${{ !inputs.runtime_checks && !inputs.full_acceptance && needs.changes.outputs.backends != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAVEN_OPTS: -Xms64m -Xmx384m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: chmod +x mvnw
      - name: Java build and unit tests (no Docker)
        env:
          MAVEN_PROJECTS: ${{ needs.changes.outputs.maven_projects }}
        run: >-
          ./mvnw -B -ntp -pl "$MAVEN_PROJECTS" -am verify
          '-Dtest=!IdentityMySqlTest,!LoginRateLimiterRedisTest,!IdentityBootstrapTest,!DocumentIntegrationTest,!ProcessingMySqlTest,!KafkaSqlFlowTest,!JdbcRoomDaoTest,!JdbcPaymentDaoTest'
          -Dsurefire.failIfNoSpecifiedTests=false
  cloud-preparation:
    if: inputs.runtime_checks || inputs.full_acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with: { terraform_version: '1.14.0', terraform_wrapper: false }
      - name: Validate cloud preparation without credentials or provisioning
        run: |
          terraform -chdir=infra/gcp init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/gcp fmt -check -recursive
          terraform -chdir=infra/gcp validate
          terraform -chdir=infra/gcp test
      - name: Validate private monitoring rules and alert behavior
        run: python testing/checks/monitoring_check.py --download
  frontend-and-runtime:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAVEN_OPTS: -Xms64m -Xmx384m
      NODE_OPTIONS: --max-old-space-size=768
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.11.1', cache: npm }
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: testing/checks/requirements-implementation.txt
      - run: python -m pip install -r testing/checks/requirements-implementation.txt
      - run: npm ci
      - run: chmod +x mvnw
      - name: Basic quality checks
        if: ${{ !inputs.runtime_checks && !inputs.full_acceptance }}
        run: python tooling/scripts/run.py quality
      - name: Frontend unit tests
        if: ${{ !inputs.runtime_checks && !inputs.full_acceptance && needs.changes.outputs.web == 'true' }}
        run: npm test
      - name: Global contracts, secrets and release-policy checks
        run: |
          python testing/checks/validate_contracts.py
          python testing/checks/validate_kit.py
          python testing/checks/scan_secrets.py
          python testing/checks/selective_release_check.py
          python testing/checks/gke_release_check.py
          python testing/checks/release_resilience_check.py
      - run: python tooling/scripts/run.py test
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: npm audit --audit-level=high
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: python testing/checks/dependency_scan.py
        if: inputs.runtime_checks || inputs.full_acceptance
      - name: Cache Next compiler output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: frontend/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        if: needs.changes.outputs.web == 'true'
      - run: npm run build:local
        if: needs.changes.outputs.web == 'true'
      - run: python testing/checks/validate_deployment.py
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: python testing/checks/digest_check.py
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: python testing/checks/scan_secrets.py
        if: inputs.runtime_checks || inputs.full_acceptance
      - name: Check fresh Linux MySQL bootstrap
        if: inputs.runtime_checks || inputs.full_acceptance
        run: python testing/checks/mysql_bootstrap_check.py
      - run: python tooling/scripts/run.py up --verified-output
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: python testing/checks/migration_only.py
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          python tooling/scripts/run.py smoke
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          python testing/checks/billing_saga_check.py
        if: inputs.full_acceptance
      - run: npx playwright install --with-deps chromium
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: node testing/checks/local-tools-browser.cjs
        if: inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          node testing/checks/collaboration-browser.cjs
        if: inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          node testing/checks/billing-browser.cjs
        if: inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          node testing/checks/i18n-browser.cjs
        if: inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          node testing/checks/docsnest-browser.cjs
        if: inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          node testing/checks/source-files-browser.cjs
        if: inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          node testing/checks/structure-browser.cjs
        if: inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          node testing/checks/workspace-browser.cjs
        if: inputs.full_acceptance
      - run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          python tooling/scripts/rollout_traffic.py --local --seconds 30 --slow-seconds 35
        if: inputs.full_acceptance
      - run: npm run worker-check
        if: inputs.runtime_checks || inputs.full_acceptance
      - name: Install pinned recovery crypto tools
        if: inputs.full_acceptance
        run: python tooling/scripts/install_age.py
      - name: Real online SQL and PITR drill
        if: inputs.full_acceptance
        run: python testing/checks/online_recovery_check.py --age .tools/age/1.3.2/age/age --age-keygen .tools/age/1.3.2/age/age-keygen
      - name: Isolated complete LOCAL application recovery
        if: inputs.full_acceptance
        run: |
          python testing/checks/auth_fixture_budget.py --reserve 4
          python testing/checks/local_online_restore_check.py --age .tools/age/1.3.2/age/age --age-keygen .tools/age/1.3.2/age/age-keygen
      - run: python tooling/scripts/run.py down
        if: always() && (inputs.runtime_checks || inputs.full_acceptance)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (inputs.runtime_checks || inputs.full_acceptance)
        with:
          name: application-acceptance-evidence
          path: |
            testing/reports/rollout-traffic.json
            testing/reports/verified-fixtures.json
            testing/reports/release-resilience.json
            testing/reports/online-recovery.json
            testing/reports/local-online-restore.json
            testing/reports/online-backup-source-traffic.json
            testing/reports/restored-application-traffic.json
          retention-days: 90
  # Keep the existing required check as an aggregate: skipped/failed work cannot pass it.
  application:
    if: always()
    needs: [changes, java-unit, frontend-and-runtime, cloud-preparation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks for the selected mode
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKENDS: ${{ needs.changes.outputs.backends }}
          JAVA_RESULT: ${{ needs.java-unit.result }}
          APPLICATION_RESULT: ${{ needs.frontend-and-runtime.result }}
          CLOUD_RESULT: ${{ needs.cloud-preparation.result }}
          RUNTIME: ${{ inputs.runtime_checks || inputs.full_acceptance }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$APPLICATION_RESULT" = success
          if [ "$RUNTIME" = true ]; then
            test "$JAVA_RESULT" = skipped
            test "$CLOUD_RESULT" = success
          else
            if [ "$BACKENDS" = '[]' ]; then
              test "$JAVA_RESULT" = skipped
            else
              test "$JAVA_RESULT" = success
            fi
            test "$CLOUD_RESULT" = skipped
          fi
