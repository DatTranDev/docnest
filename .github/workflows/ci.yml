name: Validate application
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      runtime_checks:
        type: boolean
        default: false
      full_acceptance:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: Run the full Docker/browser acceptance suite
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with: { terraform_version: '1.14.0', terraform_wrapper: false }
      - name: Validate cloud preparation without credentials or provisioning
        run: |
          terraform -chdir=infra/gcp init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/gcp fmt -check -recursive
          terraform -chdir=infra/gcp validate
          terraform -chdir=infra/gcp test
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAVEN_OPTS: -Xms64m -Xmx384m
      NODE_OPTIONS: --max-old-space-size=768
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.11.1', cache: npm }
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with: { python-version: '3.12.14' }
      - run: python -m pip install -r testing/checks/requirements-implementation.txt
      - run: npm ci
      - run: chmod +x mvnw
      - run: python tooling/scripts/run.py test
      - run: npm audit --audit-level=high
      - run: python testing/checks/dependency_scan.py
      - run: npm run build
      - run: npm run build:local
      - run: python testing/checks/validate_deployment.py
      - run: python testing/checks/digest_check.py
      - run: python testing/checks/scan_secrets.py
      - name: Check fresh Linux MySQL bootstrap
        if: inputs.runtime_checks || inputs.full_acceptance
        run: python testing/checks/mysql_bootstrap_check.py
      - run: python tooling/scripts/run.py up
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: python testing/checks/migration_only.py
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: python tooling/scripts/run.py smoke
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: python testing/checks/billing_saga_check.py
        if: inputs.full_acceptance
      - run: npx playwright install --with-deps chromium
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: node testing/checks/local-tools-browser.cjs
        if: inputs.full_acceptance
      - run: node testing/checks/collaboration-browser.cjs
        if: inputs.full_acceptance
      - run: node testing/checks/billing-browser.cjs
        if: inputs.full_acceptance
      - run: node testing/checks/i18n-browser.cjs
        if: inputs.full_acceptance
      - run: node testing/checks/docsnest-browser.cjs
        if: inputs.full_acceptance
      - run: node testing/checks/source-files-browser.cjs
        if: inputs.full_acceptance
      - run: node testing/checks/structure-browser.cjs
        if: inputs.full_acceptance
      - run: npm run worker-check
        if: inputs.runtime_checks || inputs.full_acceptance
      - run: python tooling/scripts/run.py down
        if: always() && (inputs.runtime_checks || inputs.full_acceptance)
