name: Build application
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backends: ${{ steps.impact.outputs.backends }}
      web: ${{ steps.impact.outputs.web }}
      maven_projects: ${{ steps.impact.outputs.maven_projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - id: impact
        run: python tooling/scripts/detect_affected.py
  backend-build:
    needs: changes
    if: needs.changes.outputs.backends != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAVEN_OPTS: -Xms64m -Xmx384m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: chmod +x mvnw
      - name: Package backend services
        env:
          MAVEN_PROJECTS: ${{ needs.changes.outputs.maven_projects }}
        run: ./mvnw -B -ntp -pl "$MAVEN_PROJECTS" -am package -Dmaven.test.skip=true
  frontend-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=768
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.11.1', cache: npm }
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: frontend/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - run: npm run build:local
  application:
    if: always()
    needs: [changes, backend-build, frontend-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected builds to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKENDS: ${{ needs.changes.outputs.backends }}
          WEB: ${{ needs.changes.outputs.web }}
          BACKEND_RESULT: ${{ needs.backend-build.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          if [ "$BACKENDS" = '[]' ]; then
            test "$BACKEND_RESULT" = skipped
          else
            test "$BACKEND_RESULT" = success
          fi
          if [ "$WEB" = true ]; then
            test "$FRONTEND_RESULT" = success
          else
            test "$FRONTEND_RESULT" = skipped
          fi
