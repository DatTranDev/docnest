name: Validate application
on:
  push:
  pull_request:
  workflow_call:
permissions: { contents: read }
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAVEN_OPTS: -Xms64m -Xmx384m
      NODE_OPTIONS: --max-old-space-size=768
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.11.1', cache: npm }
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with: { python-version: '3.12.14' }
      - run: python -m pip install -r checks/requirements-implementation.txt
      - run: npm ci
      - run: chmod +x mvnw
      - run: python scripts/run.py test
      - run: npm audit --audit-level=high
      - run: python checks/dependency_scan.py
      - run: npm run build
      - run: python scripts/run.py up
      - run: python checks/migration_only.py
      - run: python checks/image_secrets.py
      - run: python checks/install_trivy.py
      - run: python checks/image_os_scan.py --download-db
      - run: python scripts/run.py smoke
      - run: python checks/large_http.py
      - run: python checks/replay_check.py
      - run: python checks/replay_live.py
      - run: python scripts/run.py infra-check
      - run: npx playwright install --with-deps chromium
      - run: npm run worker-check
      - run: npm run e2e
      - run: python checks/backup_restore_check.py
      - run: python checks/validate_deployment.py
      - run: python checks/digest_check.py
      - run: python checks/cloud_backup_check.py
      - run: python checks/cloud_backup_mysql_check.py
      - run: python checks/scan_secrets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-evidence
          path: |
            reports/
            !reports/raw/**
            !reports/**/*.pem
            !reports/**/*.key
      - run: python scripts/run.py down
        if: always()
