name: Routine selective GKE release
run-name: Routine release from main at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      approved_state:
        description: Reviewed full V2 environment-state JSON from the last successful deployment artifact
        type: string
        required: true
      backup_reference:
        description: Reviewed encrypted recovery object in the backup bucket, at most 24 hours old
        type: string
        required: true
      extra_services:
        description: Optional JSON application allowlist additions; detected impact cannot be excluded
        type: string
        default: '[]'
      compatible_migrations:
        description: Changed migrations have been reviewed as expand-only and safe with old Pods
        type: boolean
        default: false
permissions: { contents: read, id-token: write }
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    environment: cloud-gke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.plan.outputs.images }}
      applications: ${{ steps.plan.outputs.applications }}
      migrations: ${{ steps.plan.outputs.migrations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - id: plan
        env:
          ROUTINE_RELEASE_ENABLED: ${{ vars.ROUTINE_RELEASE_ENABLED }}
          ROLLOUT_ACCEPTANCE_RUN: ${{ vars.ROLLOUT_ACCEPTANCE_RUN }}
          RESTORE_DRILL_RUN: ${{ vars.RESTORE_DRILL_RUN }}
          MIGRATIONS_COMPATIBLE: ${{ inputs.compatible_migrations }}
          STATE_JSON: ${{ inputs.approved_state }}
          EXTRA_SERVICES: ${{ inputs.extra_services }}
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python tooling/scripts/routine_release.py plan
  build:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    uses: ./.github/workflows/cloud-images.yml
    with:
      environment_name: cloud-gke
      affected_services: ${{ needs.plan.outputs.images }}
  validate-manifests:
    needs: plan
    if: needs.plan.outputs.images == '[]' && needs.plan.outputs.applications != '[]'
    uses: ./.github/workflows/ci.yml
    with: { runtime_checks: true }
  deploy:
    needs: [plan, build, validate-manifests]
    if: ${{ always() && needs.plan.result == 'success' && ((needs.build.result == 'success' && needs.validate-manifests.result == 'skipped') || (needs.build.result == 'skipped' && needs.validate-manifests.result == 'success')) && needs.plan.outputs.applications != '[]' }}
    # All full, routine and maintenance mutation paths use this same environment lock.
    concurrency: { group: cloud-gke-deployment, cancel-in-progress: false }
    environment: cloud-gke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STATE_JSON: ${{ inputs.approved_state }}
      EXTRA_SERVICES: ${{ inputs.extra_services }}
      BUILD_MANIFEST: ${{ needs.build.outputs.release_json }}
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      ZONE: ${{ vars.GCP_ZONE }}
      CLUSTER: ${{ vars.GKE_CLUSTER }}
      ORIGIN: ${{ vars.WEB_ORIGIN }}
      SNAPSHOTS: ${{ vars.GCS_SNAPSHOTS_BUCKET }}
      RESULTS: ${{ vars.GCS_RESULTS_BUCKET }}
      BACKUPS: ${{ vars.GCS_BACKUPS_BUCKET }}
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      TRUSTED_PROXY_CIDRS: ${{ vars.TRUSTED_PROXY_CIDRS }}
      MAX_USERS: ${{ vars.MAX_USERS || '10' }}
      STRIPE_PRO_MONTHLY_PRICE: ${{ vars.STRIPE_PRO_MONTHLY_PRICE }}
      STRIPE_PRO_YEARLY_PRICE: ${{ vars.STRIPE_PRO_YEARLY_PRICE }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      ROUTINE_RELEASE_ENABLED: ${{ vars.ROUTINE_RELEASE_ENABLED }}
      ROLLOUT_ACCEPTANCE_RUN: ${{ vars.ROLLOUT_ACCEPTANCE_RUN }}
      RESTORE_DRILL_RUN: ${{ vars.RESTORE_DRILL_RUN }}
      MIGRATIONS_COMPATIBLE: ${{ inputs.compatible_migrations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.11.1' }
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: testing/checks/requirements-implementation.txt
      - run: python -m pip install -r testing/checks/requirements-implementation.txt
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with: { install_components: gke-gcloud-auth-plugin }
      - name: Verify approved live state, recovery point and rollout acceptance
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials "$CLUSTER" --zone "$ZONE" --project "$PROJECT"
          python tooling/scripts/routine_release.py prepare
      - name: Render only affected applications and migration Jobs
        env:
          SERVICES: ${{ needs.plan.outputs.applications }}
          MIGRATIONS: ${{ needs.plan.outputs.migrations }}
        run: |
          node --input-type=module - <<'JS'
          import { loadConfig } from './frontend/web/server/gateway.mjs';
          loadConfig(process.env);
          JS
          python tooling/scripts/render_cloud.py --project "$PROJECT" --region "$REGION" --origin "$ORIGIN" --snapshots-bucket "$SNAPSHOTS" --results-bucket "$RESULTS" --digests digests.json --google-client-id "$GOOGLE_CLIENT_ID" --max-users "$MAX_USERS" --stripe-pro-monthly-price "$STRIPE_PRO_MONTHLY_PRICE" --stripe-pro-yearly-price "$STRIPE_PRO_YEARLY_PRICE" --services "$SERVICES" --migration-services "$MIGRATIONS" --release-id "$RELEASE_ID" --output cloud-render
      - name: Apply reviewed desired state with readiness observation and no scale-to-zero
        run: python tooling/scripts/routine_rollout.py
      - name: Explain failed routine rollout
        if: failure()
        run: echo '::warning::Inspect per-stage evidence and current schema/Pod state. No automatic schema rollback or full-app restart is performed. A PENDING state artifact must not be approved as the next release baseline.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: selective-deployment-evidence, path: deployment-evidence/ }
