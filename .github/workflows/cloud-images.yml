name: Build cloud images (manual, no deploy)
run-name: Build cloud images from ${{ github.ref_name }} at ${{ github.sha }}
on:
  workflow_dispatch:
  workflow_call:
permissions: { contents: read, id-token: write }
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  images:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cloud-lab
    steps:
      - name: Check cloud build configuration
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for key in GCP_PROJECT GCP_REGION GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing cloud-lab environment variable: $key"
              exit 1
            fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Authenticate registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build commit images
        env:
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/editor
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          for service in identity-service document-service processing-service collaboration-service payment-service; do
            docker build -f infra/compose/Service.Dockerfile --build-arg SERVICE="$service" -t "text-editor/$service:local" -t "$REGISTRY/$service:$GITHUB_SHA" .
          done
          docker build -f infra/compose/Web.Dockerfile --build-arg "NEXT_PUBLIC_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" -t text-editor/web:local -t "$REGISTRY/web:$GITHUB_SHA" .
      - name: Scan the exact images before publishing
        run: |
          set -euo pipefail
          python testing/checks/image_secrets.py
          python testing/checks/install_trivy.py
          python testing/checks/image_os_scan.py --download-db
      - name: Publish scanned commit images
        env:
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/editor
        run: |
          set -euo pipefail
          for service in identity-service document-service processing-service collaboration-service payment-service web; do
            docker push "$REGISTRY/$service:$GITHUB_SHA"
            docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$service:$GITHUB_SHA" >> image-digests.txt
          done
          python tooling/scripts/digest_manifest.py --project "${{ vars.GCP_PROJECT }}" --region "${{ vars.GCP_REGION }}" --input image-digests.txt --output image-digests.json
      - name: Record built release
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          release = {
              'commit': os.environ['SOURCE_SHA'],
              'ref': os.environ['SOURCE_REF'],
              'runUrl': os.environ['RUN_URL'],
              'images': json.loads(pathlib.Path('image-digests.json').read_text()),
              'googleClientId': os.environ.get('GOOGLE_CLIENT_ID', ''),
              'nativeFormatVersion': 6,
          }
          pathlib.Path('cloud-release.json').write_text(json.dumps(release, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Built and published six scanned images. Download the cloud-image-digests artifact for the commit, source ref and immutable digests.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-image-digests
          path: |
            image-digests.txt
            image-digests.json
            cloud-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-image-scan-evidence
          path: |
            testing/reports/image-secrets.json
            testing/reports/image-os-scan.json
            testing/reports/image-os/
