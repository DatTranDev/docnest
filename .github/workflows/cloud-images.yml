name: Build scanned images (internal)
run-name: Build cloud images from ${{ github.ref_name }} at ${{ github.sha }}
on:
  workflow_call:
    inputs:
      affected_services:
        type: string
        default: '["identity-service","document-service","processing-service","collaboration-service","payment-service","web"]'
    outputs:
      image_digests:
        value: ${{ jobs.images.outputs.image_digests }}
      release_json:
        value: ${{ jobs.images.outputs.release_json }}
permissions: { contents: read, id-token: write }
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      runtime_checks: true
  images:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cloud-gke
    env:
      BUILD_SERVICES: ${{ inputs.affected_services || '["identity-service","document-service","processing-service","collaboration-service","payment-service","web"]' }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      image_digests: ${{ steps.release.outputs.image_digests }}
      release_json: ${{ steps.release.outputs.release_json }}
    steps:
      - name: Check cloud build configuration
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for key in GCP_PROJECT GCP_REGION GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing cloud-gke environment variable: $key"
              exit 1
            fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Authenticate registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Restore cloud build layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/cloud-build-cache
          key: cloud-build-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cloud-build-${{ runner.os }}-${{ github.sha }}-
            cloud-build-${{ runner.os }}-
      - name: Build selected commit images
        run: python tooling/scripts/cloud_images.py build
      - name: Scan the exact selected images before publishing
        run: python tooling/scripts/cloud_images.py scan
      - name: Publish only scanned immutable images
        run: python tooling/scripts/cloud_images.py publish
      - name: Record per-service build provenance
        id: release
        run: python tooling/scripts/cloud_images.py record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-image-digests
          path: |
            image-digests.txt
            image-digests.json
            cloud-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-image-scan-evidence
          path: |
            testing/reports/cloud-build-stages.json
            testing/reports/image-secrets.json
            testing/reports/image-os-scan.json
            testing/reports/image-os/
