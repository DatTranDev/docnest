name: Deploy reviewed GKE digests (manual)
on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Protected target configuration
        type: choice
        options: [cloud-gke]
        default: cloud-gke
      image_digests:
        description: Six-image JSON from the tested cloud-images artifact
        type: string
        required: true
      backup_reference:
        description: Reviewed encrypted backup reference taken before this rollout
        type: string
        required: true
  workflow_call:
    inputs:
      environment_name:
        type: string
        default: cloud-gke
      image_digests:
        type: string
        required: true
      release_json:
        type: string
        required: true
      backup_reference:
        type: string
        default: ''
      automatic_backup:
        type: boolean
        default: false
      require_release:
        type: boolean
        default: true
permissions: { contents: read, id-token: write }
concurrency: { group: cloud-gke-deployment, cancel-in-progress: false }
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.environment_name == 'cloud-gke'
    environment: ${{ inputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      ZONE: ${{ vars.GCP_ZONE }}
      CLUSTER: ${{ vars.GKE_CLUSTER }}
      ORIGIN: ${{ vars.WEB_ORIGIN }}
      SNAPSHOTS: ${{ vars.GCS_SNAPSHOTS_BUCKET }}
      RESULTS: ${{ vars.GCS_RESULTS_BUCKET }}
      TRUSTED_PROXY_CIDRS: ${{ vars.TRUSTED_PROXY_CIDRS }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      MAX_USERS: ${{ vars.MAX_USERS || '10' }}
      STRIPE_PRO_MONTHLY_PRICE: ${{ vars.STRIPE_PRO_MONTHLY_PRICE }}
      STRIPE_PRO_YEARLY_PRICE: ${{ vars.STRIPE_PRO_YEARLY_PRICE }}
      DIGEST_JSON: ${{ inputs.image_digests }}
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
      BACKUPS: ${{ vars.GCS_BACKUPS_BUCKET }}
      AUTOMATIC_BACKUP: ${{ inputs.automatic_backup && 'true' || 'false' }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      JWT_SECRET_VERSION: ${{ vars.JWT_SECRET_VERSION }}
      BACKUP_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      GCP_BACKUP_SERVICE_ACCOUNT: ${{ vars.GCP_BACKUP_SERVICE_ACCOUNT }}
      RELEASE_JSON: ${{ inputs.release_json }}
      REQUIRE_RELEASE: ${{ inputs.require_release && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.11.1' }
      - name: Validate operator input and prepare manifest
        run: |
          set -euo pipefail
          python -m pip install -r testing/checks/requirements-implementation.txt
          if [ "$AUTOMATIC_BACKUP" = true ]; then
            for key in BACKUP_AGE_RECIPIENT JWT_SECRET_VERSION GCP_BACKUP_SERVICE_ACCOUNT; do
              test -n "${!key}"
            done
            export BACKUP_REFERENCE="gs://$BACKUPS/gke/pre-update-$BACKUP_RUN_ID.age"
          fi
          python - <<'PY'
          import os, pathlib
          for key in ('PROJECT','REGION','ZONE','CLUSTER','ORIGIN','SNAPSHOTS','RESULTS','BACKUP_REFERENCE','BACKUPS'):
              if not os.environ.get(key): raise SystemExit('Missing configuration: '+key)
          pathlib.Path('reviewed-digests.json').write_text(os.environ['DIGEST_JSON'])
          PY
          python tooling/scripts/digest_manifest.py --project "$PROJECT" --region "$REGION" --input reviewed-digests.json --output digests.json
          python tooling/scripts/gke_release_input.py
          if [ "$AUTOMATIC_BACKUP" = true ]; then
            printf 'BACKUP_REFERENCE=%s\n' "$BACKUP_REFERENCE" >> "$GITHUB_ENV"
          fi
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with: { install_components: gke-gcloud-auth-plugin }
      - name: Render and server validate before maintenance or migrations
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials "$CLUSTER" --zone "$ZONE" --project "$PROJECT"
          python tooling/scripts/render_cloud.py --project "$PROJECT" --region "$REGION" --origin "$ORIGIN" --snapshots-bucket "$SNAPSHOTS" --results-bucket "$RESULTS" --digests digests.json --google-client-id "$GOOGLE_CLIENT_ID" --max-users "$MAX_USERS" --stripe-pro-monthly-price "$STRIPE_PRO_MONTHLY_PRICE" --stripe-pro-yearly-price "$STRIPE_PRO_YEARLY_PRICE" --output cloud-render
          # Use the same validation as the runtime before preserving reviewed TLS
          # proxy trust in this rollout. An omitted variable keeps the safe default.
          node --input-type=module - <<'JS'
          import { loadConfig } from './frontend/web/server/gateway.mjs';
          loadConfig(process.env);
          JS
          python - <<'PY'
          import json, os, pathlib, subprocess, yaml
          target=pathlib.Path('cloud-render/applications.yaml')
          objects=list(yaml.safe_load_all(target.read_text()))
          for obj in objects:
              if obj['kind']=='Deployment':
                  current=json.loads(subprocess.check_output(['kubectl','-n','editor-lab','get','deployment',obj['metadata']['name'],'-o','json']))
                  replicas=current['spec'].get('replicas',1)
                  if not isinstance(replicas,int) or isinstance(replicas,bool) or replicas<1: raise SystemExit('Existing applications must have positive desired replicas')
                  obj['spec']['replicas']=replicas
              if obj['kind']=='Deployment' and obj['metadata']['name']=='web':
                  env=obj['spec']['template']['spec']['containers'][0]['env']
                  next(item for item in env if item['name']=='TRUSTED_PROXY_CIDRS')['value']=os.environ['TRUSTED_PROXY_CIDRS']
          target.write_text(yaml.safe_dump_all(objects,sort_keys=False))
          backends=[obj for obj in objects if obj['metadata']['name']!='web']
          web=[obj for obj in objects if obj['metadata']['name']=='web']
          pathlib.Path('cloud-render/backends.yaml').write_text(yaml.safe_dump_all(backends,sort_keys=False))
          pathlib.Path('cloud-render/web.yaml').write_text(yaml.safe_dump_all(web,sort_keys=False))
          bootstrap=yaml.safe_load_all(pathlib.Path('cloud-render/bootstrap.yaml').read_text())
          config=next(obj for obj in bootstrap if obj['kind']=='ConfigMap' and obj['metadata']['name']=='editor-config')
          pathlib.Path('cloud-render/config.yaml').write_text(yaml.safe_dump(config,sort_keys=False))
          PY
          # Existing bootstrap, secrets, IAM, SQL and Kafka are operator prerequisites.
          # Capture previous deployment images without reading Kubernetes secrets.
          mkdir -p deployment-evidence
          for service in identity-service document-service processing-service collaboration-service payment-service web; do
            kubectl -n editor-lab get deployment "$service" -o jsonpath='{.metadata.name}{" "}{.spec.template.spec.containers[0].image}{"\n"}' >> deployment-evidence/previous-digests.txt
          done
          cp digests.json deployment-evidence/reviewed-digests.json
          printf '%s\n' "$BACKUP_REFERENCE" > deployment-evidence/backup-reference.txt
          # Validate new Jobs under temporary names: existing Job templates are immutable.
          python - <<'PY'
          import pathlib, yaml
          jobs=list(yaml.safe_load_all(pathlib.Path('cloud-render/migrations.yaml').read_text()))
          for job in jobs: job['metadata']['name']+='-validation'
          pathlib.Path('cloud-render/migration-validation.yaml').write_text(yaml.safe_dump_all(jobs))
          PY
          kubectl create --dry-run=server -f cloud-render/migration-validation.yaml
          kubectl apply --dry-run=server -f cloud-render/config.yaml
          kubectl apply --dry-run=server -f cloud-render/applications.yaml
          python - <<'PY'
          import json, subprocess
          for name in ('identity-service','document-service','processing-service','collaboration-service','payment-service'):
              r=subprocess.run(['kubectl','-n','editor-lab','get','job','migrate-'+name,'--ignore-not-found','-o','json'],check=True,capture_output=True,text=True)
              if r.stdout and json.loads(r.stdout).get('status',{}).get('active',0): raise SystemExit('A migration Job is still active; inspect it before retrying')
          PY
      - name: Install backup encryption tool
        if: inputs.automatic_backup
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      - name: Authenticate dedicated backup identity
        if: inputs.automatic_backup
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SERVICE_ACCOUNT }}
      - name: Capture fresh encrypted backup with application writes paused
        if: inputs.automatic_backup
        run: python tooling/scripts/gke_auto_backup.py capture
      - name: Restore scoped deploy identity after backup
        if: inputs.automatic_backup
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Verify reviewed encrypted backup exists before rollout
        run: |
          set -euo pipefail
          BACKUP_SIZE=$(gcloud storage objects describe "$BACKUP_REFERENCE" --project="$PROJECT" --format='value(size)')
          test "$BACKUP_SIZE" -gt 0
      - name: Migrate and roll out the reviewed release
        run: |
          set -euo pipefail
          kubectl -n editor-lab delete job migrate-identity-service migrate-document-service migrate-processing-service migrate-collaboration-service migrate-payment-service --ignore-not-found
          # Preserve reviewed public configuration before migrations and rollout.
          # Bootstrap/IAM/secrets already exist; this account updates only editor-config.
          kubectl apply -f cloud-render/config.yaml
          kubectl apply -f cloud-render/migrations.yaml
          kubectl -n editor-lab wait --for=condition=complete --timeout=300s job/migrate-identity-service job/migrate-document-service job/migrate-processing-service job/migrate-collaboration-service job/migrate-payment-service
          # Readers must be ready before publishing the current native-format writer.
          kubectl apply -f cloud-render/backends.yaml
          for service in identity-service document-service processing-service collaboration-service payment-service; do
            kubectl -n editor-lab rollout status deployment/"$service" --timeout=300s
          done
          kubectl apply -f cloud-render/web.yaml
          kubectl -n editor-lab rollout status deployment/web --timeout=300s
          curl --fail --silent --show-error "$ORIGIN/healthz" > deployment-evidence/public-health.txt
      - name: Finish automatic backup maintenance
        if: inputs.automatic_backup
        run: python tooling/scripts/gke_auto_backup.py complete
      - name: Explain failed maintenance state
        if: failure() && inputs.automatic_backup
        run: |
          echo '::warning::Inspect editor-lab deployment backup-run annotations and migration state. A failed read-only backup attempts to resume unchanged previous apps. After migration/rollout begins, no automatic SQL rollback or blind restart is performed.'
      - name: Record approved full environment state
        run: |
          python - <<'PYCODE'
          import json, os, pathlib
          release = json.loads(os.environ.get('RELEASE_JSON') or '{}')
          if release.get('schemaVersion') == 2:
              release['rolloutStatus'] = 'PASS'
              pathlib.Path('deployment-evidence/environment-state.json').write_text(json.dumps(release, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: deployment-evidence, path: deployment-evidence/ }
