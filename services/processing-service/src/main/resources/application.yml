server:
  port: ${PORT:8083}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: processing-service
  task:
    scheduling:
      pool:
        size: 4
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${PROCESSING_DB_URL:jdbc:mysql://localhost:3306/processing_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${PROCESSING_DB_USER:processing}
    password: ${PROCESSING_DB_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: PLAIN
      sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:processing}" password="${KAFKA_PASSWORD:}";'
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
editor:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    jwk-uri: ${JWT_JWK_URI:http://localhost:8081/.well-known/jwks.json}
  document-url: ${DOCUMENT_URL:http://localhost:8082}
  processing-internal-key: ${PROCESSING_INTERNAL_KEY:}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    root: ${STORAGE_ROOT:./data/objects}
    bucket: ${GCS_BUCKET:}
    snapshots-bucket: ${SNAPSHOTS_BUCKET:}
    origin: ${ALLOWED_ORIGINS:http://localhost:8080}
  processing:
    enabled: ${PROCESSING_ENABLED:true}
    max-active-jobs: ${MAX_ACTIVE_JOBS:5}

logging:
  structured:
    format:
      console: logstash
