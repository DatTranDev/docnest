server:
  port: ${PORT:8081}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: PLAIN
      sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:identity}" password="${KAFKA_PASSWORD:}";'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: billing-identity-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.partition.fetch.bytes: 65536
    listener:
      ack-mode: manual_immediate
  application:
    name: identity-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:mysql://localhost:3306/identity_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${IDENTITY_DB_USER:identity}
    password: ${IDENTITY_DB_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
editor:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    key-path: ${JWT_KEY_PATH:./data/identity-key.pem}
    allow-key-generation: ${JWT_ALLOW_KEY_GENERATION:false}
  auth:
    secure-cookies: ${SECURE_COOKIES:true}
    origins: ${ALLOWED_ORIGINS:http://localhost:8080}
    document-internal-key: ${DOCUMENT_INTERNAL_KEY:}
    max-users: ${MAX_USERS:10}

logging:
  level:
    org.springframework.kafka.listener.DefaultErrorHandler: 'OFF'
    org.springframework.kafka.listener.KafkaMessageListenerContainer: 'OFF'
    org.springframework.kafka.listener.FailedRecordTracker: 'OFF'
  structured:
    format:
      console: logstash
